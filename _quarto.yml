project:
  type: book

book:
  title: "Book of Imagery"
  subtitle: "Translating imagery into meaningful social and policy measures"
  reader-mode: true
  author: "Francisco Rowe, Ron Mahabir, Olly Butters, Batool Almarzouq, Daniel Arribas-Bel, Fang Chen, Jon Elsey, Rachel Franklin, Arturo Guzman Perez, Richard Kingston, Vitaly Kryukov, Shaonlee Patranabis, Martina Pardy, Maria Peppa, Elisabetta Pietrostefani, Emma Radoux, Sarah Rodgers, Behzad Valipour Shokouhi, Paul Watson"
  date: 12/11/2025
  publisher: "Imago - Data Service for Imagery"
  edition: "Version 0.1"

  page-footer:
    left: |
      Imago | UKRI Imagery Data Service
    right: |
      This book was built with <a href="https://quarto.org/">Quarto</a>.
  # cover-image: assets/Imago-logo.png
  favicon: assets/Imago-logo.png
  repo-url: https://github.com/Imago-SDRUK/book-of-imagery
  repo-branch: main
  repo-actions: [edit, issue]
  downloads: [pdf]

  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - chapters/intro.qmd
        - chapters/image-data.qmd
    - part: "Data products"
      chapters:
        - chapters/clive.qmd
        - chapters/spf.qmd
        - chapters/rgb.qmd
    - part: "Social research and policy application"
    - chapters/references.qmd

bibliography:
  - references.bib
  - chapters/clive-references.bib

format:
  html:
    theme:
      light:
        - style/theme.scss
      dark:
        - style/dark.scss
    include-in-header:
      text: |
        <script>
          document.addEventListener("DOMContentLoaded", function() {
            var sidebar = document.getElementById('quarto-sidebar');
            const anchor = document.createElement("a")
            anchor.setAttribute('href', 'https://imago.ac.uk')
            anchor.style.width = "100%"
            const image = document.createElement('img') 
            image.setAttribute('src', '/assets/Imago-logo.png')
            image.style.width = "100%"
            anchor?.appendChild(image)
            sidebar?.prepend(anchor)
          });
        </script> 
        <script defer src="https://events.imago.ac.uk/script.js" data-website-id="e4bb6d0e-f873-4273-94d1-b7f06bc39620"></script>
  pdf:
    documentclass: scrreprt
    papersize: a4
    pdf-engine: xelatex
    toc: true
    number-sections: true
    number-depth: 3
    colorlinks: true
    include-in-header: style/pdf-preamble.tex
    include-before-body: style/pdf-before-body.tex

editor: visual
